name: calsnap
description: 사진 한 장으로 칼로리를 기록하는 데일리 칼로리 트래커
publish_to: 'none'
version: 0.1.2+6

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # UI 다국어(14개 언어) — lib/l10n/app_*.arb + gen-l10n
  flutter_localizations:
    sdk: flutter

  # 상태관리
  provider: ^6.1.2

  # 카메라 / 이미지
  camera: ^0.10.5+9
  image_picker: ^1.1.2
  image: ^4.2.0

  # 로컬 DB (1년치 텍스트 요약 로그 저장)
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # 네트워크 (식약처 식품영양성분DB, AI 인식 API 연동)
  http: ^1.2.1

  # 상황별 격려 멘트 실시간 음성 안내 (wedi_app과 동일한 파이프라인: 사전 녹음 없이 기기 TTS 엔진 사용)
  flutter_tts: ^4.0.0

  # 날짜/시간, 차트
  intl: ^0.19.0
  fl_chart: ^0.68.0

  # 쇼핑 제휴 딥링크 (웨디 연동 코드 재사용 예정)
  url_launcher: ^6.3.0
  shared_preferences: ^2.5.3
  uuid: ^4.6.0

  # 시크릿 모드(앱 잠금) 비밀번호 해시
  crypto: ^3.0.3

  # AdMob 배너/전면 광고
  google_mobile_ads: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/
    - assets/calsnap_phrases.json
    - assets/food_db_seed.json

# Android mipmap-mdpi ~ xxxhdpi용 ic_launcher를 assets/icon/icon.png(512x512)로부터
# 생성한다. `dart run flutter_launcher_icons`로 실행.
flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "assets/icon/icon.png"
  min_sdk_android: 24
