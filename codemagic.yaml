workflows:
  android-debug-distribution:
    name: CalSnap Android Debug (Firebase App Distribution)
    max_build_duration: 30
    # 무료 플랜은 매달 500분의 무료 빌드 시간을 macOS M2 머신에만 제공한다
    # (linux/linux_x2/windows 등은 인스턴스 종류와 무관하게 무료 플랜에 아예 포함되지
    # 않고 결제 활성화가 필요함). Android APK 빌드 자체는 Mac 머신에서도 문제없이
    # 되므로 mac_mini_m2로 무료 시간을 쓴다.
    instance_type: mac_mini_m2
    environment:
      # stable로 두면 Codemagic이 그때그때 최신 stable Flutter를 받아오는데, 로컬 개발
      # SDK(3.29.3)와 버전이 어긋나면 flutter_localizations가 요구하는 intl 고정 버전이
      # 서로 달라져 "version solving failed"가 난다(로컬 SDK는 intl 0.19.0을 정확히
      # 고정 요구). 로컬과 정확히 같은 버전으로 고정해서 이 문제를 원천 차단한다.
      flutter: 3.29.3
      # PROXY_API_KEY, PROXY_BASE_URL: Codemagic 웹 UI > Environment variables에서
      # "calsnap_secrets" 그룹으로 등록(Secure 체크)한 값을 여기서 그룹으로 불러온다.
      # firebase_service_account, FIREBASE_ANDROID_APP_ID도 같은 그룹에 등록해서 쓴다.
      groups:
        - calsnap_secrets
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get
      - name: Build debug APK
        script: |
          flutter build apk --debug \
            --dart-define=PROXY_API_KEY="$PROXY_API_KEY" \
            --dart-define=PROXY_BASE_URL="$PROXY_BASE_URL"
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
    publishing:
      # firebase_service_account / FIREBASE_ANDROID_APP_ID는 여기 문법이 아니라, Codemagic
      # 웹 UI > Environment variables에서 "calsnap_secrets" 그룹에 그 이름 그대로 변수가
      # 등록돼 있어야 통과한다("Environment variable ... used in workflows > ... but not
      # defined" 에러는 문법 오류가 아니라 그 변수가 아직 등록 안 됐거나 다른 그룹에
      # 들어있을 때 뜬다).
      firebase:
        firebase_service_account: $FIREBASE_SERVICE_ACCOUNT_JSON
        android:
          app_id: $FIREBASE_ANDROID_APP_ID
          artifact_type: apk
          groups:
            - testers
